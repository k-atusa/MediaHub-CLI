name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract version
        id: get_version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${RAW_TAG}" >> $GITHUB_OUTPUT

      - name: Build binaries
        env:
          VER: ${{ steps.get_version.outputs.version }}
        run: |
          mkdir -p dist
          
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VER}" -trimpath -o "dist/mediahub-cli-${VER}-windows-amd64.exe" .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VER}" -trimpath -o "dist/mediahub-cli-${VER}-windows-arm64.exe" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VER}" -trimpath -o "dist/mediahub-cli-${VER}-linux-amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VER}" -trimpath -o "dist/mediahub-cli-${VER}-linux-arm64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VER}" -trimpath -o "dist/mediahub-cli-${VER}-macos-arm64" .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VER}" -trimpath -o "dist/mediahub-cli-${VER}-darwin-arm64" .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
